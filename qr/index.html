<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소단원별 학생 입장 QR — 교사용</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#128241;</text></svg>">
<link rel="stylesheet" href="../assets/theme.css">
<style>
  .hero { padding: 48px 30px 8px; max-width: 1180px; margin: 0 auto; }
  .hero .eyebrow { font-size: 12px; letter-spacing: .14em; color: var(--teal-700); font-weight: 800; }
  .hero h1 { font-size: clamp(28px, 4.4vw, 40px); margin: 12px 0 12px; font-weight: 400; }
  .hero p { color: var(--mist); font-size: 15px; line-height: 1.75; max-width: 720px; margin: 0; }
  .hero .back { display: inline-block; margin-bottom: 10px; font-size: 13px; color: var(--mist); text-decoration: none; font-weight: 700; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 22px 30px 80px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 18px; }
  .chip { border: 2px solid var(--line); border-radius: 999px; padding: 7px 14px; font: inherit; font-weight: 800; font-size: 13.5px; background: var(--card); color: var(--ink); cursor: pointer; }
  .chip.on { border-color: var(--brand); background: var(--brand-100); color: var(--brand-700); }
  .bar .sp { flex: 1; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 14px; }
  .card { background: #fff; color: #10202e; border: 2px solid var(--line); border-radius: 18px; padding: 16px 16px 14px; text-align: center; break-inside: avoid; page-break-inside: avoid; }
  .card .s { font-size: 12.5px; font-weight: 800; color: #0f766e; }
  .card .n { font-family: "Jua", "Gothic A1", sans-serif; font-size: 19px; margin: 4px 0 10px; line-height: 1.3; min-height: 2.6em; display: flex; align-items: center; justify-content: center; }
  .card .q { width: 180px; height: 180px; margin: 0 auto; }
  .card .q svg { width: 100%; height: 100%; display: block; }
  .card .u { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #5b6b7b; margin: 8px 0 8px; word-break: break-all; }
  .card .row { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .card .row .btn { padding: 6px 12px; font-size: 12.5px; }
  .note { color: var(--mist); font-size: 13px; line-height: 1.75; margin: 0 0 16px; }
  .bar select { font: inherit; font-weight: 700; font-size: 13.5px; padding: 7px 10px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); color: var(--ink); max-width: 100%; }
  .uh { grid-column: 1 / -1; margin: 14px 0 0; font-size: 16px; font-weight: 800; color: var(--ink); }
  .uh:first-child { margin-top: 0; }
  .card.whole { border-style: dashed; }
  @media (max-width: 780px) { .hero { padding: 34px 18px 8px; } .wrap { padding: 18px 18px 70px; } }
  /* 인쇄: A4 한 장에 6개(2 × 3), 칸마다 잘라 쓰기 */
  @media print {
    @page { size: A4; margin: 12mm; }
    body { background: #fff !important; }
    .hero, .bar, .note, .theme-toggle, .card .row, .uh { display: none !important; }
    .wrap { padding: 0; max-width: none; }
    .grid { grid-template-columns: 1fr 1fr; gap: 0; }
    .card { border: 1px dashed #999; border-radius: 0; height: 89mm; padding: 6mm 4mm; display: flex; flex-direction: column; justify-content: center; }
    .card .q { width: 52mm; height: 52mm; }
    .card .n { min-height: 0; font-size: 16pt; }
    .card .u { font-size: 8pt; }
  }
</style>
</head>
<body>

<div class="hero">
  <a class="back" href="../">← 교사용 허브</a>
  <div class="eyebrow">교사용 · 학생 입장</div>
  <h1 class="display">소단원별 학생 입장 QR</h1>
  <p>오늘 수업할 소단원의 QR을 화면에 띄우거나 인쇄해 나눠 주세요. 학생이 휴대폰으로 찍으면 그 소단원 이야기가 바로 열리고, 학생 화면에는 그 소단원과 거기에 맞춘 문제만 보입니다. 단원을 처음부터 시작할 때는 ‘단원 전체’ QR을 쓰세요(00 들어가기부터 열립니다).</p>
</div>

<div class="wrap">
  <div class="bar" id="bar"></div>
  <p class="note">‘크게 띄우기’를 누르면 교실 화면 가득 QR이 뜹니다. 인쇄하면 지금 보이는 QR이 A4 한 장에 여섯 개씩 나오고, 점선을 따라 잘라 쓰면 됩니다. 단원을 먼저 고르면 그 단원 것만 인쇄됩니다.</p>
  <div class="grid" id="grid"></div>
</div>

<button class="theme-toggle" id="themeToggle">라이트 모드</button>
<script>try { localStorage.setItem("sth-teacher", "1"); } catch (e) {}</script>
<script src="../assets/theme.js"></script>
<script src="../assets/precheck-all.js"></script>
<script src="../data/sections.js"></script>
<script src="../assets/qrcode.js"></script>
<script>
(function () {
  "use strict";
  var BASE = "https://wmfsljy-coder.github.io/";
  var UL = window.STH_UNITS || [], SUBJ = [];
  UL.forEach(function (r) { if (SUBJ.indexOf(r[1]) < 0) SUBJ.push(r[1]); });
  var SECT = window.STH_SECTIONS || {};
  function param(k) { var m = new RegExp("[?&]" + k + "=([^&]+)").exec(location.search); return m ? decodeURIComponent(m[1]) : ""; }
  var pick = param("s"), unit = param("u");
  var bar = document.getElementById("bar"), grid = document.getElementById("grid");
  function el(t, c, s) { var e = document.createElement(t); if (c) e.className = c; if (s != null) e.textContent = s; return e; }
  function remember() { var a = []; if (pick) a.push("s=" + encodeURIComponent(pick)); if (unit) a.push("u=" + encodeURIComponent(unit)); history.replaceState(null, "", a.length ? "?" + a.join("&") : location.pathname); }
  /* ‘통합과학’ 처럼 앞부분만 맞아도 고른다(통합과학1·통합과학2) */
  function inSubj(r) { return !pick || r[1].indexOf(pick) === 0; }
  function chips() {
    bar.innerHTML = "";
    [""].concat(SUBJ).forEach(function (s) {
      var b = el("button", "chip" + (pick === s ? " on" : ""), s || "전체"); b.type = "button";
      b.addEventListener("click", function () { pick = s; unit = ""; remember(); chips(); paint(); });
      bar.appendChild(b);
    });
    var sel = el("select"); sel.setAttribute("aria-label", "단원 고르기");
    var o0 = el("option", null, "단원 고르기 (전체)"); o0.value = ""; sel.appendChild(o0);
    UL.filter(inSubj).forEach(function (r) { var o = el("option", null, (pick ? "" : r[1] + " · ") + r[2]); o.value = r[5]; if (r[5] === unit) o.selected = true; sel.appendChild(o); });
    sel.addEventListener("change", function () { unit = sel.value; remember(); paint(); });
    bar.appendChild(sel);
    bar.appendChild(el("span", "sp"));
    var pr = el("button", "btn", "🖨 인쇄"); pr.type = "button"; pr.addEventListener("click", function () { window.print(); }); bar.appendChild(pr);
  }
  function card(sub, name, url, cls, alt) {
    var c = el("div", "card" + (cls ? " " + cls : ""));
    c.appendChild(el("div", "s", sub));
    c.appendChild(el("div", "n", name));
    var q = el("div", "q"), qr = window.qrcode(0, "M"); qr.addData(url); qr.make();
    q.innerHTML = qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true, alt: alt });
    c.appendChild(q);
    c.appendChild(el("div", "u", url.replace(/^https:\/\//, "")));
    var row = el("div", "row");
    var big = el("button", "btn primary", "크게 띄우기"); big.type = "button";
    big.addEventListener("click", function () { window.sthQR(url, name, sub); });
    var go = el("a", "btn", "미리 보기"); go.href = url + (url.indexOf("?") < 0 ? "?" : "&") + "open=1"; go.target = "_blank"; go.rel = "noopener";
    row.appendChild(big); row.appendChild(go); c.appendChild(row);
    return c;
  }
  function paint() {
    grid.innerHTML = "";
    UL.filter(function (r) { return inSubj(r) && (!unit || r[5] === unit); }).forEach(function (r) {
      var url = BASE + r[5] + "/", sub = r[1] + (r[3] ? " · " + r[3] : "");
      grid.appendChild(el("h3", "uh", r[1] + " · " + r[2]));
      (SECT[r[5]] || []).forEach(function (s) {
        grid.appendChild(card(r[1] + " · " + r[2], s[0] + " " + s[1], url + "?sec=" + s[0], "", s[1] + " 학생 입장 QR"));
      });
      grid.appendChild(card(sub, r[2] + " — 단원 전체", url, "whole", r[2] + " 학생 입장 QR"));
    });
    if (!grid.children.length) grid.appendChild(el("p", "note", "이 과목의 단원이 없습니다."));
  }
  chips(); paint();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>반별 활동 — 교사용</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#128202;</text></svg>">
<link rel="stylesheet" href="../assets/theme.css">
<style>
  .hero { padding: 48px 30px 8px; max-width: 1180px; margin: 0 auto; }
  .hero .eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--teal-700); font-weight: 800; }
  .hero h1 { font-size: clamp(28px, 4.4vw, 40px); margin: 12px 0 12px; font-weight: 400; }
  .hero p { color: var(--mist); font-size: 15px; line-height: 1.75; max-width: 700px; margin: 0; }
  .hero .back { display: inline-block; margin-bottom: 10px; font-size: 13px; color: var(--mist); text-decoration: none; font-weight: 700; }
  .hero .back:hover { color: var(--teal-700); }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 22px 30px 80px; }
  .panel { background: var(--panel); border: 2px solid var(--line); border-radius: 18px; padding: 20px 22px; margin-bottom: 20px; }
  .panel h2 { font-size: 19px; margin: 0 0 4px; font-weight: 400; }
  .panel .sub { color: var(--mist); font-size: 13px; line-height: 1.7; margin: 0 0 16px; }

  .keyrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  .keyrow label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 800; color: var(--mist); }
  .keyrow input { border: 2px solid var(--line); border-radius: 12px; padding: 9px 12px; font-size: 14px;
    font-family: inherit; background: var(--card-2); color: var(--ink); width: 280px; }
  .keyrow input:focus { outline: none; border-color: var(--brand); }
  .keyrow select { border: 2px solid var(--line); border-radius: 12px; padding: 8px 10px; font-size: 14px; font-family: inherit; background: var(--card-2); color: var(--ink); max-width: 360px; }
  .msg { font-size: 13px; color: var(--mist); margin-left: 4px; }
  .msg.bad { color: var(--rose-700); }

  .cls-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 12px; }
  .cls-card { border: 2px solid var(--line); border-radius: 16px; padding: 14px 16px; background: var(--card); cursor: pointer;
    transition: border-color .15s, transform .15s; }
  .cls-card:hover { border-color: var(--teal-dim); transform: translateY(-2px); }
  .cls-card.on { border-color: var(--brand); background: var(--brand-100); }
  .cls-card .name { font-family: "Jua"; font-size: 22px; color: var(--ink); }
  .cls-card .nums { font-size: 12.5px; color: var(--mist); margin-top: 6px; line-height: 1.7; }
  .cls-card .nums b { color: var(--teal-700); }

  .tbl-scroll { overflow-x: auto; margin-top: 8px; }
  table.act { border-collapse: collapse; font-size: 12.5px; min-width: 100%; }
  table.act th, table.act td { border: 1px solid var(--line); padding: 7px 10px; text-align: center; white-space: nowrap; }
  table.act th.unit, table.act td.unit { text-align: left; white-space: normal; min-width: 240px; max-width: 380px; font-weight: 800; color: var(--ink); }
  table.act thead th { background: var(--card-2); color: var(--mist); font-weight: 800; position: sticky; top: 0; }
  table.act td.n { font-weight: 800; color: var(--ink); }
  table.act td.z { color: var(--line); }

  .feed { display: flex; flex-direction: column; gap: 6px; }
  .feed-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 8px 12px; border-radius: 12px;
    background: var(--card-2); border: 2px solid var(--line); font-size: 12.5px; color: var(--mist); }
  .feed-row .who { font-weight: 800; color: var(--ink); }
  .feed-row .cls { font-weight: 800; color: var(--teal-700); }
  .feed-row .u { flex: 1 1 220px; }
  .feed-row .t { font-size: 11.5px; }
  .feed-row.first { border-color: var(--teal-100); }

  .subj-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 2px solid var(--line); border-radius: 999px; padding: 7px 14px; font: inherit; font-weight: 800; font-size: 13.5px;
    background: var(--card); color: var(--ink); cursor: pointer; }
  .chip:hover { border-color: var(--teal-dim); }
  .chip.on { border-color: var(--brand); background: var(--brand-100); color: var(--brand-700); }
  .chip.on .c { color: var(--brand-700); }
  .chip .c { color: var(--mist); font-weight: 700; margin-left: 4px; font-size: 12px; }
  .chip:disabled { opacity: .45; cursor: default; }
  .empty { color: var(--mist); font-size: 13.5px; line-height: 1.8; }
  .steps { color: var(--mist); font-size: 13.5px; line-height: 1.9; margin: 10px 0 0; padding-left: 20px; }
  .steps b { color: var(--ink); }
  .steps code { background: var(--card-2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; font-size: 12px; }
  .glance { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 12px; margin-top: 6px; }
  .gl-box { border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; background: var(--card); }
  .gl-box h4 { margin: 0 0 4px; font-size: 13.5px; color: var(--ink); }
  .gl-box .q { font-size: 12.5px; color: var(--mist); line-height: 1.6; margin: 0 0 8px; }
  .gl-opt { display: grid; grid-template-columns: 1fr 90px 46px; gap: 8px; align-items: center; font-size: 12.5px; color: var(--ink); padding: 3px 0; }
  .gl-opt i { display: block; height: 8px; border-radius: 99px; background: var(--card-2); border: 1px solid var(--line); overflow: hidden; }
  .gl-opt i b { display: block; height: 100%; background: var(--teal-dim); }
  .gl-opt.ok { font-weight: 800; }
  .gl-opt.ok i b { background: var(--brand); }
  .gl-opt span:last-child { text-align: right; color: var(--mist); font-variant-numeric: tabular-nums; }
  .gl-list { margin: 0; padding-left: 18px; font-size: 12.5px; line-height: 1.75; color: var(--ink); }
  .gl-list .m { color: var(--mist); }
  @media (max-width: 780px) { .hero { padding: 34px 18px 8px; } .wrap { padding: 18px 18px 70px; } }
</style>
</head>
<body>

<div class="hero">
  <a class="back" href="../">← 교사용 허브</a>
  <div class="eyebrow">교사용 · 우리 반 공유</div>
  <h1 class="display">반별 활동</h1>
  <p>학생들이 각 단원의 <b>우리 반</b> 탭에서 올린 기록을 반별로 모아 보여 줍니다. 학생이 쓴 글까지 보시려면 구글 시트를 여세요.</p>
</div>

<div class="wrap">

  <div class="panel">
    <h2 class="display">교사 열쇠</h2>
    <p class="sub">시트의 <b>설정</b> 탭 B1에 있는 글자입니다. 한 번 넣으면 이 브라우저에 기억됩니다.</p>
    <div class="keyrow">
      <label>열쇠 <input type="password" id="key" placeholder="시트 설정 탭 B1" autocomplete="off"></label>
      <button class="btn primary" type="button" id="go">불러오기</button>
      <button class="btn" type="button" id="forget">잊기</button>
      <span class="msg" id="msg"></span>
    </div>
  </div>

  <div id="out"></div>

</div>

<button class="theme-toggle" id="themeToggle">라이트 모드</button>
<script src="../assets/theme.js"></script>
<script src="../assets/share-config.js"></script>
<script src="../assets/precheck-all.js"></script>
<script>
(function () {
  "use strict";
  var KEY = "sth-teacher-key";
  var URL_ = (window.STH_SHARE_URL || "").trim();
  var $ = function (id) { return document.getElementById(id); };
  function el(t, c, s) { var e = document.createElement(t); if (c) e.className = c; if (s != null) e.textContent = s; return e; }
  function when(t) {
    var d = new Date(t);
    if (!t || isNaN(d.getTime())) return "";
    return (d.getMonth() + 1) + "월 " + d.getDate() + "일 " + ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
  }
  function ago(t) {
    if (!t) return "";
    var s = (Date.now() - t) / 1000;
    if (s < 90) return "방금";
    if (s < 3600) return Math.round(s / 60) + "분 전";
    if (s < 86400) return Math.round(s / 3600) + "시간 전";
    return Math.round(s / 86400) + "일 전";
  }

  var out = $("out"), msg = $("msg"), pick = null, data = null, evd = null;

  /* 과목별 보기 — 단원 코드로 과목을 찾는다(../assets/precheck-all.js의 STH_UNITS) */
  var SUBJ_KEY = "sth-teacher-subj", subj = null;
  try { subj = localStorage.getItem(SUBJ_KEY) || null; } catch (e) {}
  var UL = window.STH_UNITS || [], UMAP = {}, SUBJS = [];
  UL.forEach(function (r, i) { UMAP[r[0]] = { subj: r[1], name: r[2], i: i }; if (SUBJS.indexOf(r[1]) < 0) SUBJS.push(r[1]); });
  function subjOf(u) { return UMAP[u] ? UMAP[u].subj : "기타"; }
  function inSubj(u) { return !subj || subjOf(u) === subj; }
  /* 단원 이름: 과목을 골랐으면 단원 이름만, 전체 보기에서는 과목 이름을 앞에 붙인다 */
  function uname(u, fallback) { var m = UMAP[u]; return m ? (subj ? m.name : m.subj + " " + m.name) : (fallback || u); }
  function setSubj(s) { subj = s; try { if (s) localStorage.setItem(SUBJ_KEY, s); else localStorage.removeItem(SUBJ_KEY); } catch (e) {} grp.unit = null; grp.list = null; paint(); }
  function scope() { return (subj ? subj + " · " : "") + (pick ? pick + "반" : (subj ? "모든 반" : "")); }

  function note(html) { out.innerHTML = ""; var p = el("div", "panel"); p.innerHTML = html; out.appendChild(p); }

  if (!URL_) {
    note('<h2 class="display">아직 공유가 켜지지 않았습니다</h2>'
       + '<p class="sub">이 저장소의 <code>assets/share-config.js</code>에 웹 앱 주소가 비어 있습니다.</p>');
  }

  try { $("key").value = localStorage.getItem(KEY) || ""; } catch (e) {}

  function load() {
    var k = ($("key").value || "").trim();
    if (!URL_) { msg.textContent = "공유 주소가 없습니다."; msg.className = "msg bad"; return; }
    if (!k) { msg.textContent = "열쇠를 넣어 주세요."; msg.className = "msg bad"; return; }
    msg.textContent = "불러오는 중…"; msg.className = "msg";
    /* 열쇠가 주소에 남지 않도록 POST로 보낸다(text/plain이라 사전 요청이 없다) */
    fetch(URL_, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
                  body: JSON.stringify({ action: "teacher", key: k }) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok) throw new Error(j.error || "오류");
        try { localStorage.setItem(KEY, k); } catch (e) {}
        msg.textContent = "불러왔습니다. " + when(Date.now());
        data = j; paint();
        loadEv(k);
      })
      .catch(function (e) {
        msg.textContent = "불러오지 못했습니다. (" + e.message + ")"; msg.className = "msg bad";
        note('<h2 class="display">불러오지 못했습니다</h2>'
           + '<p class="sub">열쇠가 다르거나, 시트에서 아직 <b>권한 승인</b>을 하지 않았을 수 있습니다.</p>'
           + '<ol class="steps">'
           + '<li>구글 시트 <b>과학 수업</b>를 엽니다.</li>'
           + '<li>위쪽 메뉴에서 <b>우리 반 공유 → 준비하기 / 교사 열쇠 보기</b>를 누릅니다.</li>'
           + '<li>권한을 허용하면 <b>교사 열쇠</b>가 뜹니다. 그 글자를 위 칸에 넣으세요.</li>'
           + '</ol>');
      });
  }

  /* 수업 효과 기록(첫 추리·완주·한 번에 맞힘·막힌 장면) — 열쇠가 맞을 때만 */
  function loadEv(k) {
    fetch(URL_, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
                  body: JSON.stringify({ action: "evidence", key: k }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (j.ok) { evd = j.rows || []; paint(); } })
      .catch(function () {});
  }
  function pct(a, b) { return b ? Math.round(a / b * 100) + "%" : "–"; }
  function evRows() {
    var rows = (evd || []).filter(function (r) { return (!pick || r.cls === pick) && inSubj(r.unit); });
    return rows.map(function (r) {
      var epN = 0, epDone = 0, stuck = {};
      r.eps.forEach(function (e) { epN += e.n; epDone += e.done; Object.keys(e.stuck).forEach(function (sc) { var key = e.k + " " + sc + "장면"; stuck[key] = (stuck[key] || 0) + e.stuck[sc]; }); });
      var top = Object.keys(stuck).sort(function (a, b) { return stuck[b] - stuck[a]; })[0];
      return { unit: r.unit, label: r.label || r.unit, cls: r.cls, n: r.n, ev: r.withEv,
               pre: pct(r.g1, r.gn), preN: r.gn, done: pct(epDone, epN), q1: pct(r.q1, r.qt), qt: r.qt,
               lab: pct(r.lab, r.n), stuck: top ? top + " (" + stuck[top] + "명)" : "–",
               gates: r.gates.map(function (g) { return g.k + " " + g.ok + "/" + g.n; }).join(" · "),
               miss: Object.keys(r.miss || {}).sort(function (a, b) { return r.miss[b] - r.miss[a]; }).slice(0, 5).map(function (id) { return id + " " + r.miss[id] + "명"; }).join(" · ") || "–" };
    });
  }
  function csv() {
    var head = ["단원", "단원이름", "반", "올린 학생", "효과 기록 학생", "첫 추리 정답률", "첫 추리 응답 수", "이야기 완주율", "수준별 문제 한 번에 맞힌 비율", "손댄 문항 수", "응용 실험실 1개 이상 해결", "가장 많이 멈춘 장면", "첫 추리 문항별(맞음/응답)", "처음에 많이 틀린 문항(10-09부터)"];
    var lines = [head].concat(evRows().map(function (r) { return [r.unit, r.label, r.cls, r.n, r.ev, r.pre, r.preN, r.done, r.q1, r.qt, r.lab, r.stuck, r.gates, r.miss]; }));
    var txt = String.fromCharCode(0xFEFF) + lines.map(function (l) { return l.map(function (c) { c = String(c); return (c.indexOf(",") >= 0 || c.indexOf("\"") >= 0 || c.indexOf(String.fromCharCode(10)) >= 0) ? "\"" + c.split("\"").join("\"\"") + "\"" : c; }).join(","); }).join(String.fromCharCode(13, 10));
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([txt], { type: "text/csv;charset=utf-8" }));
    a.download = "수업효과_" + (pick || "전체") + "_" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  function paintEv() {
    if (!evd) return;
    var p = el("div", "panel");
    p.appendChild(el("h2", "display", "수업 효과"));
    var sub = el("p", "sub");
    sub.innerHTML = "학생이 올릴 때 함께 오는 기록입니다(2026-10-03 이후 올린 것부터). <b>첫 추리 정답률</b>은 이야기를 시작하기 전 예상이 맞은 비율(사전), "
      + "<b>이야기 완주율</b>은 끝까지 푼 이야기의 비율, <b>한 번에 맞힌 비율</b>은 수준별 문제를 해설 없이 첫 시도에 맞힌 비율(사후)입니다. "
      + "첫 추리는 일부러 오개념을 건드리는 질문이라 낮게 나오는 것이 정상입니다. 학생 수가 적으면 해석에 주의하세요."
      + (scope() ? "  지금은 " + scope() + "만 보고 있습니다." : "");
    p.appendChild(sub);
    var rows = evRows();
    if (!rows.length) { p.appendChild(el("p", "empty", "아직 효과 기록이 담긴 올리기가 없습니다. 학생이 다음에 올리면 쌓이기 시작합니다.")); out.appendChild(p); return; }
    var bt = el("button", "btn", "📥 표 내려받기 (CSV)"); bt.type = "button"; bt.addEventListener("click", csv);
    p.appendChild(bt);
    var sc = el("div", "tbl-scroll"), tb = document.createElement("table"); tb.className = "act";
    var cols = [["unit", "단원"], ["cls", "반"], ["n", "학생"], ["pre", "첫 추리 정답률(사전)"], ["done", "이야기 완주율"], ["q1", "한 번에 맞힘(사후)"], ["lab", "실험실 해결"], ["stuck", "가장 많이 멈춘 장면"]];
    var tr = document.createElement("tr"); cols.forEach(function (c) { var th = document.createElement("th"); if (c[0] === "unit") th.className = "unit"; th.textContent = c[1]; tr.appendChild(th); });
    var th_ = document.createElement("thead"); th_.appendChild(tr); tb.appendChild(th_);
    var tbody = document.createElement("tbody");
    rows.forEach(function (r) {
      var t = document.createElement("tr");
      cols.forEach(function (c) { var td = document.createElement("td"); if (c[0] === "unit") { td.className = "unit"; td.textContent = r.label; td.title = r.gates; } else td.textContent = r[c[0]]; t.appendChild(td); });
      tbody.appendChild(t);
    });
    tb.appendChild(tbody); sc.appendChild(tb); p.appendChild(sc);
    out.appendChild(p);
    paintPc();
    paintGroups(rows);
  }

  /* 학생 생각 점검 — 단원을 시작할 때의 생각(사전)과 이야기를 끝낸 뒤의 생각(사후).
     확신하고 틀린 학생이 많은 문장이 그 반에 단단히 박힌 오개념이다. */
  function paintPc() {
    var TXT = window.STH_PC_ITEMS || {};
    var rows = (evd || []).filter(function (r) { return (!pick || r.cls === pick) && inSubj(r.unit) && r.pc && r.pc.length; });
    var p = el("div", "panel");
    p.appendChild(el("h2", "display", "학생 생각 점검"));
    p.appendChild(el("p", "sub", "단원 첫머리의 ‘내 생각 점검’ 기록입니다. 확신하고 틀린 학생이 많은 문장부터 늘어놓았습니다. "
      + "이런 문장은 수업 첫머리에 반 전체에 던져 토론을 여는 데 쓰기 좋습니다. ‘사전 → 사후 정답’은 처음과 이야기 뒤에 모두 답한 학생만으로 셉니다. "
      + "시트 메뉴 ‘우리 반 공유 → 생각 점검 표 새로 만들기’를 누르면 같은 표가 시트의 ‘생각 점검’ 탭에도 만들어집니다."));
    if (!rows.length) { p.appendChild(el("p", "empty", "아직 올라온 생각 점검 기록이 없습니다. 학생이 단원 첫머리의 생각 점검에 답하고 우리 반 탭에서 올리면 여기에 쌓입니다.")); out.appendChild(p); return; }
    rows.forEach(function (r) {
      var items = TXT[r.unit] || {};
      var hh = el("h3", null, (r.label || r.unit) + " · " + r.cls + "반"); hh.style.cssText = "font-size:15px;margin:16px 0 6px"; p.appendChild(hh);
      /* 오개념 변화 — 처음·이야기 뒤를 모두 답한 짝만 셈 */
      var T = { pn: 0, pre: 0, post: 0, preSW: 0, postSW: 0, fix: 0, slip: 0, stay: 0 };
      r.pc.forEach(function (x) { Object.keys(T).forEach(function (k) { T[k] += x[k] || 0; }); });

      card.appendChild(el("div", "name", c.cls));
      var n = el("div", "nums");
      n.innerHTML = (c.students == null ? "기록 <b>" + c.n + "</b>건" : "학생 <b>" + c.students + "</b>명") + " · 단원 <b>" + c.units + "</b>개<br>마지막 " + (when(c.last) || "-") + " (" + ago(c.last) + ")";
      card.appendChild(n);
      card.addEventListener("click", function () { pick = (pick === c.cls) ? null : c.cls; paint(); });
      g.appendChild(card);
    });
    p1.appendChild(g);
    out.appendChild(p1);

    /* 2) 단원 × 반 표 */
    var shown = pick ? classes.filter(function (c) { return c.cls === pick; }) : classes;
    var byUnit = {};
    cells.forEach(function (x) {
      if (pick && x.cls !== pick) return;
      if (!inSubj(x.unit)) return;
      if (!byUnit[x.unit]) byUnit[x.unit] = { unit: x.unit, label: uname(x.unit, units[x.unit]), by: {}, last: null, sum: 0 };
      byUnit[x.unit].by[x.cls] = x;
      byUnit[x.unit].sum += x.n;
      if (x.last && (byUnit[x.unit].last === null || x.last > byUnit[x.unit].last)) byUnit[x.unit].last = x.last;
    });
    /* 과목을 골랐으면 아직 아무도 올리지 않은 단원도 빈 줄로 보여 주고, 교과서 순서로 늘어놓는다 */
    if (subj) UL.forEach(function (r) { if (r[1] === subj && !byUnit[r[0]]) byUnit[r[0]] = { unit: r[0], label: r[2], by: {}, last: null, sum: 0 }; });
    var rows = Object.keys(byUnit).map(function (u) { return byUnit[u]; });
    if (subj) rows.sort(function (a, b) { return (UMAP[a.unit] ? UMAP[a.unit].i : 1e4) - (UMAP[b.unit] ? UMAP[b.unit].i : 1e4); });
    else rows.sort(function (a, b) { return (b.last || 0) - (a.last || 0); });

    var p2 = el("div", "panel");
    p2.appendChild(el("h2", "display", "단원별 · 반별"));
    p2.appendChild(el("p", "sub", "칸의 숫자는 그 단원을 올린 학생 수입니다." + (scope() ? "  지금은 " + scope() + "만 보고 있습니다." : "")));
    var sc = el("div", "tbl-scroll"), tb = document.createElement("table");
    tb.className = "act";
    var thead = document.createElement("thead"), tr = document.createElement("tr");
    var th0 = document.createElement("th"); th0.className = "unit"; th0.textContent = "단원"; tr.appendChild(th0);
    shown.forEach(function (c) { var th = document.createElement("th"); th.textContent = c.cls; tr.appendChild(th); });
    var thS = document.createElement("th"); thS.textContent = "합"; tr.appendChild(thS);
    var thT = document.createElement("th"); thT.textContent = "마지막"; tr.appendChild(thT);
    thead.appendChild(tr); tb.appendChild(thead);
    var tbody = document.createElement("tbody");
    rows.forEach(function (r) {
      var t2 = document.createElement("tr");
      var td0 = document.createElement("td"); td0.className = "unit"; td0.textContent = r.label; t2.appendChild(td0);
      shown.forEach(function (c) {
        var x = r.by[c.cls], td = document.createElement("td");
        td.className = x ? "n" : "z"; td.textContent = x ? x.n : "·";
        if (x) td.title = c.cls + "반 · " + when(x.last);
        t2.appendChild(td);
      });
      var tdS = document.createElement("td"); tdS.className = "n"; tdS.textContent = r.sum; t2.appendChild(tdS);
      var tdT = document.createElement("td"); tdT.textContent = ago(r.last); t2.appendChild(tdT);
      tbody.appendChild(t2);
    });
    tb.appendChild(tbody); sc.appendChild(tb); p2.appendChild(sc);
    out.appendChild(p2);

    /* 3) 최근 활동 */
    var p3 = el("div", "panel");
    p3.appendChild(el("h2", "display", "최근 활동"));
    p3.appendChild(el("p", "sub", "올릴 때마다 한 줄씩 쌓입니다. 덮어쓰기와 상관없이 남는 기록입니다."));
    var feed = el("div", "feed"), list = recent.filter(function (r) { return (!pick || r.cls === pick) && inSubj(r.unit); }).slice(0, 40);
    if (!list.length) { p3.appendChild(el("p", "empty", "아직 없습니다.")); }
    list.forEach(function (r) {
      var row = el("div", "feed-row" + (r.kind === "처음" ? " first" : ""));
      row.appendChild(el("span", "cls", r.cls));
      row.appendChild(el("span", "who", r.nick));
      row.appendChild(el("span", "u", r.label || r.unit));
      row.appendChild(el("span", null, r.kind + " · " + r.n + "칸"));
      row.appendChild(el("span", "t", when(r.t) + " (" + ago(r.t) + ")"));
      feed.appendChild(row);
    });
    p3.appendChild(feed);
    out.appendChild(p3);
    paintEv();
  }

  $("go").addEventListener("click", load);
  $("key").addEventListener("keydown", function (e) { if (e.key === "Enter") load(); });
  $("forget").addEventListener("click", function () {
    try { localStorage.removeItem(KEY); } catch (e) {}
    $("key").value = ""; out.innerHTML = ""; msg.textContent = "잊었습니다."; msg.className = "msg";
  });
  if (URL_ && $("key").value) load();
})();
</script>
</body>
</html>

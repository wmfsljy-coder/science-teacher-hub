<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>반별 활동 — 교사용</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#128202;</text></svg>">
<link rel="stylesheet" href="../assets/theme.css">
<style>
  .hero { padding: 48px 30px 8px; max-width: 1180px; margin: 0 auto; }
  .hero .eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--teal-700); font-weight: 800; }
  .hero h1 { font-size: clamp(28px, 4.4vw, 40px); margin: 12px 0 12px; font-weight: 400; }
  .hero p { color: var(--mist); font-size: 15px; line-height: 1.75; max-width: 700px; margin: 0; }
  .hero .back { display: inline-block; margin-bottom: 10px; font-size: 13px; color: var(--mist); text-decoration: none; font-weight: 700; }
  .hero .back:hover { color: var(--teal-700); }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 22px 30px 80px; }
  .panel { background: var(--panel); border: 2px solid var(--line); border-radius: 18px; padding: 20px 22px; margin-bottom: 20px; }
  .panel h2 { font-size: 19px; margin: 0 0 4px; font-weight: 400; }
  .panel .sub { color: var(--mist); font-size: 13px; line-height: 1.7; margin: 0 0 16px; }

  .keyrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  .keyrow label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 800; color: var(--mist); }
  .keyrow input { border: 2px solid var(--line); border-radius: 12px; padding: 9px 12px; font-size: 14px;
    font-family: inherit; background: var(--card-2); color: var(--ink); width: 280px; }
  .keyrow input:focus { outline: none; border-color: var(--brand); }
  .msg { font-size: 13px; color: var(--mist); margin-left: 4px; }
  .msg.bad { color: var(--rose-700); }

  .cls-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 12px; }
  .cls-card { border: 2px solid var(--line); border-radius: 16px; padding: 14px 16px; background: var(--card); cursor: pointer;
    transition: border-color .15s, transform .15s; }
  .cls-card:hover { border-color: var(--teal-dim); transform: translateY(-2px); }
  .cls-card.on { border-color: var(--brand); background: var(--brand-100); }
  .cls-card .name { font-family: "Jua"; font-size: 22px; color: var(--ink); }
  .cls-card .nums { font-size: 12.5px; color: var(--mist); margin-top: 6px; line-height: 1.7; }
  .cls-card .nums b { color: var(--teal-700); }

  .tbl-scroll { overflow-x: auto; margin-top: 8px; }
  table.act { border-collapse: collapse; font-size: 12.5px; min-width: 100%; }
  table.act th, table.act td { border: 1px solid var(--line); padding: 7px 10px; text-align: center; white-space: nowrap; }
  table.act th.unit, table.act td.unit { text-align: left; white-space: normal; min-width: 240px; max-width: 380px; font-weight: 800; color: var(--ink); }
  table.act thead th { background: var(--card-2); color: var(--mist); font-weight: 800; position: sticky; top: 0; }
  table.act td.n { font-weight: 800; color: var(--ink); }
  table.act td.z { color: var(--line); }

  .feed { display: flex; flex-direction: column; gap: 6px; }
  .feed-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 8px 12px; border-radius: 12px;
    background: var(--card-2); border: 2px solid var(--line); font-size: 12.5px; color: var(--mist); }
  .feed-row .who { font-weight: 800; color: var(--ink); }
  .feed-row .cls { font-weight: 800; color: var(--teal-700); }
  .feed-row .u { flex: 1 1 220px; }
  .feed-row .t { font-size: 11.5px; }
  .feed-row.first { border-color: var(--teal-100); }

  .empty { color: var(--mist); font-size: 13.5px; line-height: 1.8; }
  .steps { color: var(--mist); font-size: 13.5px; line-height: 1.9; margin: 10px 0 0; padding-left: 20px; }
  .steps b { color: var(--ink); }
  .steps code { background: var(--card-2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; font-size: 12px; }
  @media (max-width: 780px) { .hero { padding: 34px 18px 8px; } .wrap { padding: 18px 18px 70px; } }
</style>
</head>
<body>

<div class="hero">
  <a class="back" href="../">← 교사용 허브</a>
  <div class="eyebrow">교사용 · 우리 반 공유</div>
  <h1 class="display">반별 활동</h1>
  <p>학생들이 각 단원의 <b>우리 반</b> 탭에서 올린 기록을 반별로 모아 보여 줍니다. 학생이 쓴 글까지 보시려면 구글 시트를 여세요.</p>
</div>

<div class="wrap">

  <div class="panel">
    <h2 class="display">교사 열쇠</h2>
    <p class="sub">시트의 <b>설정</b> 탭 B1 에 있는 글자입니다. 한 번 넣으면 이 브라우저에 기억됩니다.</p>
    <div class="keyrow">
      <label>열쇠 <input type="password" id="key" placeholder="시트 설정 탭 B1" autocomplete="off"></label>
      <button class="btn primary" type="button" id="go">불러오기</button>
      <button class="btn" type="button" id="forget">잊기</button>
      <span class="msg" id="msg"></span>
    </div>
  </div>

  <div id="out"></div>

</div>

<button class="theme-toggle" id="themeToggle">라이트 모드</button>
<script src="../assets/theme.js"></script>
<script src="../assets/share-config.js"></script>
<script>
(function () {
  "use strict";
  var KEY = "sth-teacher-key";
  var URL_ = (window.STH_SHARE_URL || "").trim();
  var $ = function (id) { return document.getElementById(id); };
  function el(t, c, s) { var e = document.createElement(t); if (c) e.className = c; if (s != null) e.textContent = s; return e; }
  function when(t) {
    var d = new Date(t);
    if (!t || isNaN(d.getTime())) return "";
    return (d.getMonth() + 1) + "월 " + d.getDate() + "일 " + ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
  }
  function ago(t) {
    if (!t) return "";
    var s = (Date.now() - t) / 1000;
    if (s < 90) return "방금";
    if (s < 3600) return Math.round(s / 60) + "분 전";
    if (s < 86400) return Math.round(s / 3600) + "시간 전";
    return Math.round(s / 86400) + "일 전";
  }

  var out = $("out"), msg = $("msg"), pick = null, data = null;

  function note(html) { out.innerHTML = ""; var p = el("div", "panel"); p.innerHTML = html; out.appendChild(p); }

  if (!URL_) {
    note('<h2 class="display">아직 공유가 켜지지 않았습니다</h2>'
       + '<p class="sub">이 저장소의 <code>assets/share-config.js</code> 에 웹 앱 주소가 비어 있습니다.</p>');
  }

  try { $("key").value = localStorage.getItem(KEY) || ""; } catch (e) {}

  function load() {
    var k = ($("key").value || "").trim();
    if (!URL_) { msg.textContent = "공유 주소가 없습니다."; msg.className = "msg bad"; return; }
    if (!k) { msg.textContent = "열쇠를 넣어 주세요."; msg.className = "msg bad"; return; }
    msg.textContent = "불러오는 중…"; msg.className = "msg";
    fetch(URL_ + "?action=teacher&key=" + encodeURIComponent(k))
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok) throw new Error(j.error || "오류");
        try { localStorage.setItem(KEY, k); } catch (e) {}
        msg.textContent = "불러왔습니다. " + when(Date.now());
        data = j; paint();
      })
      .catch(function (e) {
        msg.textContent = "불러오지 못했습니다. (" + e.message + ")"; msg.className = "msg bad";
        note('<h2 class="display">불러오지 못했습니다</h2>'
           + '<p class="sub">열쇠가 다르거나, 시트에서 아직 <b>권한 승인</b>을 하지 않았을 수 있습니다.</p>'
           + '<ol class="steps">'
           + '<li>구글 시트 <b>과학 도구 — 우리 반 공유</b> 를 엽니다.</li>'
           + '<li>위쪽 메뉴에서 <b>우리 반 공유 → 준비하기 / 교사 열쇠 보기</b> 를 누릅니다.</li>'
           + '<li>권한을 허용하면 <b>교사 열쇠</b> 가 뜹니다. 그 글자를 위 칸에 넣으세요.</li>'
           + '</ol>');
      });
  }

  function paint() {
    out.innerHTML = "";
    var classes = data.classes || [], cells = data.cells || [], units = data.units || {}, recent = data.recent || [];
    if (!classes.length) {
      note('<h2 class="display">아직 올라온 기록이 없습니다</h2>'
         + '<p class="sub">학생이 단원의 <b>우리 반</b> 탭에서 한 번 올리면 여기에 나타납니다.</p>');
      return;
    }

    /* 1) 반 카드 */
    var p1 = el("div", "panel");
    p1.appendChild(el("h2", "display", "반"));
    var s1 = el("p", "sub", "반을 누르면 아래 표에서 그 반만 봅니다. 다시 누르면 전체로 돌아옵니다.");
    p1.appendChild(s1);
    var g = el("div", "cls-grid");
    classes.forEach(function (c) {
      var card = el("div", "cls-card" + (pick === c.cls ? " on" : ""));
      card.appendChild(el("div", "name", c.cls));
      var n = el("div", "nums");
      n.innerHTML = "학생 <b>" + c.students + "</b>명 · 단원 <b>" + c.units + "</b>개<br>마지막 " + (when(c.last) || "-") + " (" + ago(c.last) + ")";
      card.appendChild(n);
      card.addEventListener("click", function () { pick = (pick === c.cls) ? null : c.cls; paint(); });
      g.appendChild(card);
    });
    p1.appendChild(g);
    out.appendChild(p1);

    /* 2) 단원 × 반 표 */
    var shown = pick ? classes.filter(function (c) { return c.cls === pick; }) : classes;
    var byUnit = {};
    cells.forEach(function (x) {
      if (pick && x.cls !== pick) return;
      if (!byUnit[x.unit]) byUnit[x.unit] = { unit: x.unit, label: units[x.unit] || x.unit, by: {}, last: null, sum: 0 };
      byUnit[x.unit].by[x.cls] = x;
      byUnit[x.unit].sum += x.n;
      if (x.last && (byUnit[x.unit].last === null || x.last > byUnit[x.unit].last)) byUnit[x.unit].last = x.last;
    });
    var rows = Object.keys(byUnit).map(function (u) { return byUnit[u]; });
    rows.sort(function (a, b) { return (b.last || 0) - (a.last || 0); });

    var p2 = el("div", "panel");
    p2.appendChild(el("h2", "display", "단원별 · 반별"));
    p2.appendChild(el("p", "sub", "칸의 숫자는 그 단원을 올린 학생 수입니다." + (pick ? "  지금은 " + pick + "반만 보고 있습니다." : "")));
    var sc = el("div", "tbl-scroll"), tb = document.createElement("table");
    tb.className = "act";
    var thead = document.createElement("thead"), tr = document.createElement("tr");
    var th0 = document.createElement("th"); th0.className = "unit"; th0.textContent = "단원"; tr.appendChild(th0);
    shown.forEach(function (c) { var th = document.createElement("th"); th.textContent = c.cls; tr.appendChild(th); });
    var thS = document.createElement("th"); thS.textContent = "합"; tr.appendChild(thS);
    var thT = document.createElement("th"); thT.textContent = "마지막"; tr.appendChild(thT);
    thead.appendChild(tr); tb.appendChild(thead);
    var tbody = document.createElement("tbody");
    rows.forEach(function (r) {
      var t2 = document.createElement("tr");
      var td0 = document.createElement("td"); td0.className = "unit"; td0.textContent = r.label; t2.appendChild(td0);
      shown.forEach(function (c) {
        var x = r.by[c.cls], td = document.createElement("td");
        td.className = x ? "n" : "z"; td.textContent = x ? x.n : "·";
        if (x) td.title = c.cls + "반 · " + when(x.last);
        t2.appendChild(td);
      });
      var tdS = document.createElement("td"); tdS.className = "n"; tdS.textContent = r.sum; t2.appendChild(tdS);
      var tdT = document.createElement("td"); tdT.textContent = ago(r.last); t2.appendChild(tdT);
      tbody.appendChild(t2);
    });
    tb.appendChild(tbody); sc.appendChild(tb); p2.appendChild(sc);
    out.appendChild(p2);

    /* 3) 최근 활동 */
    var p3 = el("div", "panel");
    p3.appendChild(el("h2", "display", "최근 활동"));
    p3.appendChild(el("p", "sub", "올릴 때마다 한 줄씩 쌓입니다. 덮어쓰기와 상관없이 남는 기록입니다."));
    var feed = el("div", "feed"), list = recent.filter(function (r) { return !pick || r.cls === pick; }).slice(0, 40);
    if (!list.length) { p3.appendChild(el("p", "empty", "아직 없습니다.")); }
    list.forEach(function (r) {
      var row = el("div", "feed-row" + (r.kind === "처음" ? " first" : ""));
      row.appendChild(el("span", "cls", r.cls));
      row.appendChild(el("span", "who", r.nick));
      row.appendChild(el("span", "u", r.label || r.unit));
      row.appendChild(el("span", null, r.kind + " · " + r.n + "칸"));
      row.appendChild(el("span", "t", when(r.t) + " (" + ago(r.t) + ")"));
      feed.appendChild(row);
    });
    p3.appendChild(feed);
    out.appendChild(p3);
  }

  $("go").addEventListener("click", load);
  $("key").addEventListener("keydown", function (e) { if (e.key === "Enter") load(); });
  $("forget").addEventListener("click", function () {
    try { localStorage.removeItem(KEY); } catch (e) {}
    $("key").value = ""; out.innerHTML = ""; msg.textContent = "잊었습니다."; msg.className = "msg";
  });
  if (URL_ && $("key").value) load();
})();
</script>
</body>
</html>
